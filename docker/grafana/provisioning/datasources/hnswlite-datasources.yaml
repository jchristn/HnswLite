apiVersion: 1

# Stable UIDs so the dashboard JSON in assets/grafana can reference datasources portably.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://hnswlite-prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://hnswlite-tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
