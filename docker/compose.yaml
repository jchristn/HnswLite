services:

  hnswlite-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hnswlite
      POSTGRES_PASSWORD: hnswlite
      POSTGRES_DB: hnswlite
    ports:
      - "${HNSWLITE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnswlite -d hnswlite"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  hnswlite-postgres-provisioner:
    image: postgres:16
    depends_on:
      hnswlite-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: hnswlite
    volumes:
      - ./postgres/provision:/provision:ro
    command: ["sh", "-c", "psql -h hnswlite-postgres -U hnswlite -d hnswlite -v ON_ERROR_STOP=1 -f /provision/001_hnswlite.sql"]
    restart: "no"

  hnswlite-server:
    image: jchristn77/hnswlite-server:v2.0.0
    build:
      context: ../src
      dockerfile: HnswIndex.Server/Dockerfile
    ports:
      - "${HNSWLITE_SERVER_PORT:-8080}:8080"
    # The Prometheus scrape endpoint (9464) is intentionally not published to the host:
    # it carries operational detail and has no auth. Prometheus reaches it on the compose network.
    volumes:
      - ./hnswlite/hnswindex.json:/app/hnswindex.json
      - ./hnswlite/data/:/app/data/
      - ./hnswlite/logs/:/app/logs/
    depends_on:
      hnswlite-postgres:
        condition: service_healthy
      hnswlite-postgres-provisioner:
        condition: service_completed_successfully
      hnswlite-tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    restart: unless-stopped

  hnswlite-dashboard:
    image: jchristn77/hnswlite-dashboard:v2.0.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "${HNSWLITE_DASHBOARD_PORT:-8081}:80"
    depends_on:
      hnswlite-server:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Observability: Prometheus (metrics) + Tempo (traces) + Grafana
  # ------------------------------------------------------------------
  hnswlite-prometheus:
    image: prom/prometheus:v3.5.4
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "${HNSWLITE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - hnswlite-prometheus-data:/prometheus
    healthcheck:
      # The prometheus image ships wget (not curl); /-/healthy returns 200 when ready.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  hnswlite-tempo:
    # Pinned: later builds reject the standard ingester/compactor config sections.
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${HNSWLITE_TEMPO_PORT:-3200}:3200"
      - "${HNSWLITE_OTLP_GRPC_PORT:-4317}:4317"
      - "${HNSWLITE_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - hnswlite-tempo-data:/var/tempo
    healthcheck:
      # The tempo image ships wget (not curl); /ready returns 503 until ready, then 200.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/ready || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  hnswlite-grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "${HNSWLITE_GRAFANA_PORT:-3000}:3000"
    environment:
      # Local development defaults. Override GRAFANA_ADMIN_PASSWORD out of band for any shared or
      # hosted deployment; never commit a real password here.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - hnswlite-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../assets/grafana:/var/lib/grafana/dashboards/hnswlite:ro
    depends_on:
      hnswlite-prometheus:
        condition: service_healthy
      hnswlite-tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    restart: unless-stopped

volumes:
  hnswlite-prometheus-data:
  hnswlite-tempo-data:
  hnswlite-grafana-data:
